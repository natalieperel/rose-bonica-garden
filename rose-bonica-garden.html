<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rose Bonica</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a6820;cursor:none;touch-action:none;scrollbar-width:none;}
  html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;}
  @media(hover:none){html,body{cursor:auto;}}
  canvas{position:fixed;top:0;left:0;display:block;}
  .logo-wrap{
    position:fixed;top:44%;left:0;right:0;margin:auto;
    transform:translateY(-50%);
    z-index:30;pointer-events:none;
    width:clamp(200px,46vw,560px);
  }
  .logo-wrap img{width:100%;height:auto;display:block;
    filter:drop-shadow(0 3px 18px rgba(0,0,0,0.3));}
  .cursor{position:fixed;left:0;top:0;width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle,#fff 30%,#ff2d78);
    pointer-events:none;z-index:9999;will-change:transform;
    box-shadow:0 0 8px #ff2d78,0 0 20px #ff2d7866;}
  @media(hover:none){.cursor{display:none;}}

  

  /* ── NAV LINKS ── */
  .nav-links {
    position: fixed;
    top: calc(46% + clamp(88px, 13vw, 150px));
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    z-index: 9990;
    pointer-events: none;
  }
  /* ── Desktop: logo is taller so push buttons further down ── */
  @media (min-width: 768px) {
    .nav-links {
      top: calc(46% + clamp(120px, 17vw, 235px));
    }
  }
  .nav-links a {
    pointer-events: auto;
    display: inline-block;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    color: #ffffff;
    background: transparent;
    border: none;
    padding: 12px 26px;
    border-radius: 100px;
    box-shadow: 0 0 16px 5px rgba(255,255,255,0.22), 0 0 30px 8px rgba(255,255,255,0.08);
    text-shadow: 0 1px 6px rgba(0,0,0,0.75);
    transition: box-shadow 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  .nav-links a:hover,
  .nav-links a:active {
    background: rgba(255,45,120,0.25);
    box-shadow: 0 0 24px 10px rgba(255,45,120,0.5), 0 0 55px 18px rgba(255,45,120,0.2);
    text-shadow: 0 0 10px rgba(255,45,120,0.9), 0 1px 4px rgba(0,0,0,0.7);
  }

  /* ── GEMS ─────────────────────────────────────────────── */
  .gem{position:fixed;transform:translate(-50%,-100%);pointer-events:none;z-index:100;cursor:pointer;will-change:transform,opacity;}
  .gem svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));transition:filter 0.2s;}
  .gem:hover svg{filter:drop-shadow(0 -2px 6px rgba(255,255,255,0.9)) drop-shadow(0 1px 2px rgba(0,0,0,0.4)) brightness(1.2);}
  .gem-album{width:28px;height:28px;color:#7ee8fa;}
  .gem-single{width:18px;height:18px;color:#ffaad4;}
  .gem.hidden{opacity:0;pointer-events:none;}
  .gem.revealed{opacity:1;pointer-events:auto;animation:gemWobbleIn 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards,gemPulse 2.8s ease-in-out 0.55s infinite;}
  .gem.open svg{animation:gemBloom 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards,gemPulse 1.2s ease-in-out 0.4s infinite;}
  @keyframes gemWobbleIn{
    0%{opacity:0;transform:translate(-50%,-100%) scale(0.1) rotate(-20deg);}
    60%{opacity:1;transform:translate(-50%,-100%) scale(1.18) rotate(6deg);}
    80%{transform:translate(-50%,-100%) scale(0.92) rotate(-3deg);}
    100%{transform:translate(-50%,-100%) scale(1) rotate(0deg);}
  }
  @keyframes gemPulse{
    0%,100%{filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5)) brightness(0.88);}
    50%{filter:drop-shadow(0 -2px 5px rgba(255,255,255,0.8)) drop-shadow(0 1px 2px rgba(0,0,0,0.3)) brightness(1.4);}
  }
  @keyframes gemBloom{
    0%{transform:scale(1) rotate(0deg);}
    30%{transform:scale(1.6) rotate(15deg);}
    60%{transform:scale(0.85) rotate(-8deg);}
    100%{transform:scale(1.1) rotate(0deg);}
  }
  /* ── GEM CARD ─────────────────────────────────────────── */
  #gem-card{display:none;position:fixed;z-index:200;background:rgba(10,30,14,0.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.18);border-radius:14px;padding:18px 22px 16px;min-width:220px;max-width:min(320px,80vw);box-shadow:0 8px 40px rgba(0,0,0,0.55);}
  #gem-card.card-visible{display:block;animation:cardAppear 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;}
  @keyframes cardAppear{0%{opacity:0;transform:scale(0.7) translateY(12px);}100%{opacity:1;transform:scale(1) translateY(0);}}
  #gem-card .card-art{width:100%;aspect-ratio:1/1;border-radius:8px;margin-bottom:12px;overflow:hidden;background:var(--card-art-color,rgba(255,255,255,0.08));display:flex;align-items:center;justify-content:center;font:800 9px/1 Arial;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,0.3);}
  #gem-card .card-art img{width:100%;height:100%;object-fit:cover;display:block;border-radius:8px;}
  #gem-card .card-type{font:800 9px/1 Arial;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:6px;}
  #gem-card .card-title{font:800 15px/1.3 Arial;color:#fff;margin-bottom:14px;}
  #gem-card .card-link{display:inline-block;font:800 11px/1 Arial;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:#fff;background:rgba(255,45,120,0.22);border:1px solid rgba(255,45,120,0.5);border-radius:100px;padding:7px 18px;transition:background .18s;box-shadow:0 0 14px 3px rgba(255,45,120,0.25);}
  #gem-card .card-link:hover{background:rgba(255,45,120,0.45);}
  #gem-card .card-close{position:absolute;top:10px;right:12px;background:none;border:none;color:rgba(255,255,255,0.4);font-size:16px;cursor:pointer;padding:2px 4px;font-family:Arial,sans-serif;}
  #gem-card .card-close:hover{color:rgba(255,255,255,0.85);}
  /* ── SCROLL PROMPT ───────────────────────────────────── */
  #scroll-prompt{position:fixed;bottom:32px;left:0;right:0;text-align:center;z-index:150;pointer-events:none;font:800 10px/1 Arial,sans-serif;letter-spacing:0.22em;text-transform:uppercase;color:rgba(255,255,255,0.6);text-shadow:0 1px 6px rgba(0,0,0,0.5);animation:scrollPulse 2.4s ease-in-out infinite;transition:opacity 0.6s;}
  #scroll-prompt.hidden{opacity:0;}
  @keyframes scrollPulse{0%,100%{opacity:0.4;}50%{opacity:0.9;}}
</style>
</head>

<div id="scroll-prompt">scroll down to discover</div>

<div id="gem-card">

  <div class="card-art" id="gem-card-art"></div>

  <div class="card-title" id="gem-card-title"></div>

</div>

<div class="cursor" id="cursor"></div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const cur=document.getElementById('cursor');
const isMob=window.matchMedia('(hover:none)').matches;

let W,H,vpX=0,mxRaw=0;
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  vpX=W*0.5; mxRaw=W*0.5;
}
resize();
window.addEventListener('resize',()=>{resize();build();});

document.addEventListener('mousemove',e=>{
  mxRaw=e.clientX;
  cur.style.transform=`translate(${e.clientX-6}px,${e.clientY-6}px)`;
});
document.addEventListener('click',e=>{if(typeof openGemIdx!=='undefined'&&openGemIdx>=0&&!document.getElementById('gem-card').contains(e.target))closeGemCard();burst(e.clientX,e.clientY);});
document.addEventListener('touchstart',e=>{
  burst(e.touches[0].clientX,e.touches[0].clientY);
  mxRaw=e.touches[0].clientX;
},{passive:true});
document.addEventListener('touchmove',e=>{mxRaw=e.touches[0].clientX;},{passive:true});


// ── PERSPECTIVE (same low angle as original grass version) ──
// Horizon high up at 17% — camera is near the ground
const HOR  = () => H * 0.17;
const sY   = z  => HOR() + (H - HOR()) * z;
const sX   = (wx,z) => vpX + wx * W * 0.78 * z;
// Scale: tiny near horizon, large at front — strong perspective
const sSc  = z  => 0.018 + z * z * 1.45;

const rnd=(a,b)=>a+Math.random()*(b-a);

let clusters=[],sparkles=[],petals=[];
let time=0,windPhase=0;

// ── FLOWER CLUSTER ─────────────────────────────────────────
function mkCluster(wx,z){
  const t=Math.random();
  const pal=t<.22?'purple':t<.44?'pink':t<.60?'white':t<.76?'yellow':'mixed';
  const sc=sSc(z);
  const count=Math.floor(rnd(6,18));
  const radius=rnd(14,38)*sc*3.8;
  const blooms=[];
  for(let i=0;i<count;i++){
    const angle=rnd(0,Math.PI*2), dist=Math.sqrt(Math.random())*radius;
    let h,s,l;
    if(pal==='purple'){h=rnd(255,295);s=rnd(55,80);l=rnd(55,78);}
    else if(pal==='pink'){h=rnd(318,362);s=rnd(70,92);l=rnd(62,82);}
    else if(pal==='white'){h=rnd(30,60);s=rnd(18,42);l=rnd(88,97);}
    else if(pal==='yellow'){h=rnd(42,65);s=rnd(85,100);l=rnd(58,75);}
    else{h=rnd(280,360);s=rnd(55,90);l=rnd(55,80);}
    blooms.push({
      ox:Math.cos(angle)*dist,
      oy:Math.sin(angle)*dist*0.42, // flatten Y for perspective feel
      r:rnd(0.3,1.1)*sc*11,
      h,s,l,
      type:Math.random()<.52?'round':'daisy',
      layer:rnd(0,1)
    });
  }
  blooms.sort((a,b)=>a.layer-b.layer);
  return{wx,z,blooms,radius,
    ss:rnd(0.3,0.8),sa:rnd(0.02,0.07),so:rnd(0,Math.PI*2)};
}

// ── CRYSTAL ────────────────────────────────────────────────

function mkSparkle(){
  const z=rnd(0.06,0.97);
  return{wx:rnd(-1.4,1.4),z,life:0,max:rnd(45,115),
    sz:rnd(0.4,2.0)*sSc(z)*2.0,gold:Math.random()>.35};
}

// ── PETAL ──────────────────────────────────────────────────
function mkPetal(x,y,amb){
  return{x,y,
    vx:amb?rnd(-1,1):rnd(-5,5),
    vy:amb?rnd(0.3,1.2):rnd(-5,-2),
    g:amb?.015:.12,
    rot:rnd(0,Math.PI*2),rv:rnd(-0.25,0.25),
    sz:rnd(6,16),life:1,
    dec:amb?.003:rnd(.007,.016),
    hue:Math.random()>.45?rnd(300,362):rnd(38,65)};
}

// ── BUILD ──────────────────────────────────────────────────
function build(){
  clusters=[]; sparkles=[];
  // z: 0.55 (back of hill, sparse) → 0.99 (camera, dense)
  // t=0 is back of hill, t=1 is front — density and size taper naturally
  const ROWS = isMob ? 28 : 36;
  for(let r=0; r<ROWS; r++){
    const t = r / (ROWS - 1);               // 0 (back) → 1 (front)
    const z = 0.55 + t * 0.44;             // 0.55 → 0.99

    // Taper: back rows are very sparse, front rows are packed
    // t^2 gives a gentle curve — almost nothing at back, lots at front
    const cc = Math.floor(1 + t*t * 28 * rnd(0.75, 1.0));

    for(let c=0; c<cc; c++) clusters.push(mkCluster(rnd(-1.15,1.15), z));
  }
  clusters.sort((a,b)=>a.z-b.z);
  for(let i=0;i<90;i++) sparkles.push(mkSparkle());
}
build();

// ── DRAW WORLD ─────────────────────────────────────────────
function drawWorld(){
  const hy=HOR();

  // Fill entire canvas green — no dark gaps ever
  ctx.fillStyle='#1a6e28';
  ctx.fillRect(0,0,W,H);

  // Sky panel
  const sky=ctx.createLinearGradient(0,0,0,hy);
  sky.addColorStop(0,'#4e9ed0');
  sky.addColorStop(0.45,'#82c2e4');
  sky.addColorStop(0.82,'#b6dff2');
  sky.addColorStop(1,'#d2ecf8');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,hy);

  // Cloud wisps
  ctx.save(); ctx.globalAlpha=0.25;
  [[W*.1,hy*.22,W*.2,hy*.09],[W*.38,hy*.14,W*.24,hy*.08],
   [W*.68,hy*.28,W*.17,hy*.09],[W*.86,hy*.12,W*.13,hy*.07]].forEach(([cx,cy,cw,ch])=>{
    const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,cw);
    gr.addColorStop(0,'#fff'); gr.addColorStop(1,'transparent');
    ctx.beginPath(); ctx.ellipse(cx,cy,cw,ch,0,0,Math.PI*2);
    ctx.fillStyle=gr; ctx.fill();
  });
  ctx.restore();

  // ── Hill helper ──────────────────────────────────────────
  // freq1/freq2 = wave frequencies, phase1/phase2 = offsets
  // gives each hill its own distinct silhouette shape
  function hill(baseY, amp, freq1, freq2, phase1, phase2, c0, c1, c2) {
    ctx.beginPath();
    const S = 14; // more segments = smoother curves
    for(let s=0;s<=S;s++){
      const x = (s/S)*(W+40)-20;
      const wave = Math.sin(s*freq1 + phase1)*amp
                 + Math.sin(s*freq2 + phase2)*amp*0.5
                 + Math.cos(s*freq1*0.4 + phase2)*amp*0.25;
      if(s===0){ ctx.moveTo(-20, baseY+wave); continue; }
      const px = ((s-0.5)/S)*(W+40)-20;
      const pw = Math.sin((s-0.5)*freq1+phase1)*amp
               + Math.sin((s-0.5)*freq2+phase2)*amp*0.5
               + Math.cos((s-0.5)*freq1*0.4+phase2)*amp*0.25;
      ctx.quadraticCurveTo(px, baseY+pw, x, baseY+wave);
    }
    ctx.lineTo(W+20, H+20);
    ctx.lineTo(-20,  H+20);
    ctx.closePath();
    const g=ctx.createLinearGradient(0, baseY-amp*1.2, 0, H);
    g.addColorStop(0,  c0);
    g.addColorStop(0.14,c1);
    g.addColorStop(0.55,c2);
    g.addColorStop(1,  '#091f0c');
    ctx.fillStyle=g; ctx.fill();
  }

  // ── Back hills — lots of variation in shape, colour, scale ──
  // Layer 1: very back, dark, tall single hump (distant ridge)
  hill(hy - H*0.04, H*0.055, 0.62, 0.28, 0.0,  1.1, '#2a7232','#1e5828','#124018');
  // Layer 2: slightly different freq — creates offset peaks from layer 1
  hill(hy - H*0.01, H*0.045, 1.10, 0.42, 0.9,  2.3, '#306e36','#245c2c','#164422');
  // Layer 3: lower, wider undulation — valley feeling between ridges
  hill(hy + H*0.03, H*0.06,  0.78, 0.55, 2.1,  0.5, '#387a40','#2a6434','#184c26');
  // Layer 4: prominent mid-distance hill, asymmetric
  hill(hy + H*0.07, H*0.075, 1.32, 0.36, 1.4,  3.0, '#3e8e48','#2e7038','#1e5428');
  // Layer 5: closer, brighter, gentle rolling
  hill(hy + H*0.13, H*0.09,  0.88, 0.62, 0.6,  1.8, '#48a050','#369040','#226630');
  // Layer 6: bold mid-ground with deep wave
  hill(hy + H*0.20, H*0.10,  1.55, 0.44, 3.2,  0.8, '#52ae5c','#3e9848','#288038');
  // Layer 7: close ground, wide gentle swell
  hill(hy + H*0.30, H*0.11,  0.72, 0.88, 1.9,  2.6, '#5ebc68','#48a854','#2e8840');

  // ── Foreground swell — camera-close ground ──────────────
  ctx.beginPath();
  ctx.moveTo(-20, H+20);
  ctx.lineTo(-20, H*0.68);
  ctx.bezierCurveTo(W*0.06,H*0.52, W*0.30,H*0.57, W*0.50,H*0.52);
  ctx.bezierCurveTo(W*0.70,H*0.48, W*0.93,H*0.54, W+20,  H*0.62);
  ctx.lineTo(W+20, H+20); ctx.closePath();
  const fg=ctx.createLinearGradient(0,H*0.48,0,H);
  fg.addColorStop(0,  '#7ae484');
  fg.addColorStop(0.08,'#5ece68');
  fg.addColorStop(0.35,'#38a442');
  fg.addColorStop(0.75,'#1e6a2c');
  fg.addColorStop(1,  '#091f0c');
  ctx.fillStyle=fg; ctx.fill();
}

// ── DRAW CRYSTAL ───────────────────────────────────────────

function fgSurfaceY(x) {
  // Foreground swell bezier control points (from drawWorld):
  // moveTo(-20, H*0.68)
  // bezierCurveTo(W*0.06,H*0.52, W*0.30,H*0.57, W*0.50,H*0.52)
  // bezierCurveTo(W*0.70,H*0.48, W*0.93,H*0.54, W+20,  H*0.62)
  // Solve cubic bezier for Y given X (approximate via linear t from x)
  const t = Math.max(0, Math.min(1, (x + 20) / (W + 40)));
  let y;
  if (t <= 0.5) {
    // First half: (-20,H*.68) → (W*.06,H*.52) → (W*.30,H*.57) → (W*.50,H*.52)
    const tt = t * 2;
    const p0y = H*0.68, p1y = H*0.52, p2y = H*0.57, p3y = H*0.52;
    y = Math.pow(1-tt,3)*p0y + 3*Math.pow(1-tt,2)*tt*p1y
      + 3*(1-tt)*tt*tt*p2y + Math.pow(tt,3)*p3y;
  } else {
    // Second half: (W*.50,H*.52) → (W*.70,H*.48) → (W*.93,H*.54) → (W+20,H*.62)
    const tt = (t - 0.5) * 2;
    const p0y = H*0.52, p1y = H*0.48, p2y = H*0.54, p3y = H*0.62;
    y = Math.pow(1-tt,3)*p0y + 3*Math.pow(1-tt,2)*tt*p1y
      + 3*(1-tt)*tt*tt*p2y + Math.pow(tt,3)*p3y;
  }
  return y;
}

// ── DRAW CLUSTER ───────────────────────────────────────────
function drawCluster(cl, wind){
  const cx   = sX(cl.wx, cl.z);
  // For high-z (front) clusters use sY so they fill bottom of screen
  // For mid-z use fgSurfaceY to sit on the hill surface
  const hillY = fgSurfaceY(cx);
  const perspY = sY(cl.z);
  // Blend: front rows (z>0.82) use perspY, back rows use hillY
  const blend = Math.max(0, Math.min(1, (cl.z - 0.62) / 0.25));
  const cy   = hillY * (1 - blend) + perspY * blend;
  const sway = Math.sin(time*cl.ss + cl.so + wind) * cl.sa;
  const offx = sway * cl.radius * 0.3;
  // Perspective: blooms are flatter/smaller further back
  const vSquish = 0.28 + cl.z * 0.32;
  const hueG = 118;
  const ligG = 38 + cl.z * 22;

  // Sort blooms back→front (least negative oy drawn last = on top)
  const sorted = cl.blooms.slice().sort((a,b)=>a.oy-b.oy);

  sorted.forEach(b => {
    const bx = cx + offx + b.ox;
    // Clamp so bloom base never goes below the ground surface
    const bloomBase = Math.min(cy, cy + b.oy * vSquish + b.r * 0.5);
    const by = bloomBase - b.r * 0.5;

    if (b.type === 'round') {
      const pc = Math.round(5 + b.r * 0.7);
      for (let p = 0; p < pc; p++) {
        const a = (p/pc)*Math.PI*2;
        ctx.beginPath();
        ctx.ellipse(
          bx + Math.cos(a)*b.r*.68,
          by + Math.sin(a)*b.r*.45,
          b.r*.50, b.r*.33, a, 0, Math.PI*2);
        ctx.fillStyle = `hsl(${b.h+p*4},${b.s}%,${b.l}%)`;
        ctx.fill();
      }
      ctx.beginPath(); ctx.arc(bx, by, b.r*.38, 0, Math.PI*2);
      ctx.fillStyle = `hsl(${b.h+15},${b.s-10}%,${b.l-14}%)`; ctx.fill();
      ctx.beginPath(); ctx.arc(bx-b.r*.14, by-b.r*.15, b.r*.17, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${b.h},${b.s}%,${b.l+22}%,0.5)`; ctx.fill();
    } else {
      const pc = Math.round(8 + b.r*0.5);
      for (let p = 0; p < pc; p++) {
        const a = (p/pc)*Math.PI*2;
        ctx.save();
        ctx.translate(bx + Math.cos(a)*b.r*.60, by + Math.sin(a)*b.r*.42);
        ctx.rotate(a);
        ctx.beginPath(); ctx.ellipse(0,0,b.r*.45,b.r*.17,0,0,Math.PI*2);
        ctx.fillStyle = `hsl(${b.h+p*3},${b.s}%,${b.l}%)`; ctx.fill();
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(bx, by, b.r*.25, 0, Math.PI*2);
      ctx.fillStyle = `hsl(${b.h+20},82%,72%)`; ctx.fill();
    }
    // Tiny stem from bloom base to ground surface
    ctx.beginPath();
    ctx.moveTo(bx, cy + 1);
    ctx.lineTo(bx, by + b.r*0.45);
    ctx.strokeStyle = `hsl(118,62%,${ligG}%)`;
    ctx.lineWidth   = Math.max(0.7, b.r * 0.15);
    ctx.stroke();
  });
}

// ── SPARKLE ────────────────────────────────────────────────
function drawSparkle(s){
  const x=sX(s.wx,s.z),y=sY(s.z)-s.sz*12*Math.random();
  const alpha=Math.sin((s.life/s.max)*Math.PI);
  const r=s.sz*(0.4+alpha*.88);
  ctx.save();ctx.globalAlpha=alpha*.88;ctx.translate(x,y);
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2,rd=i%2===0?r*3.6:r*.62;
    i===0?ctx.moveTo(Math.cos(a)*rd,Math.sin(a)*rd):ctx.lineTo(Math.cos(a)*rd,Math.sin(a)*rd);
  }
  ctx.closePath();ctx.fillStyle=s.gold?'#fffaaa':'#fff';ctx.fill();
  const gr=ctx.createRadialGradient(0,0,0,0,0,r*4.8);
  gr.addColorStop(0,'rgba(255,255,200,.24)');gr.addColorStop(1,'transparent');
  ctx.beginPath();ctx.arc(0,0,r*4.8,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();
  ctx.restore();
}

// ── PETAL ──────────────────────────────────────────────────
function drawPetal(p){
  ctx.save();ctx.globalAlpha=p.life;
  ctx.translate(p.x,p.y);ctx.rotate(p.rot);
  ctx.beginPath();ctx.ellipse(0,0,p.sz*.5,p.sz*.28,0,0,Math.PI*2);
  ctx.fillStyle=`hsl(${p.hue},88%,76%)`;ctx.fill();
  ctx.restore();
}

// ── VIGNETTE ───────────────────────────────────────────────
function vignette(){
  const gr=ctx.createRadialGradient(W/2,H*.5,H*.06,W/2,H*.5,H*.9);
  gr.addColorStop(0,'transparent');gr.addColorStop(1,'rgba(8,36,12,0.52)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
}


// ── FOREGROUND GRASS — covers dark ground gaps ─────────────
// Dense short blades painted across the bottom 40% of screen
// Pre-generated once, redrawn each frame with wind sway
let grassBlades = [];
function buildGrass() {
  grassBlades = [];
  const count = isMob ? 800 : 1400;
  for (let i = 0; i < count; i++) {
    const x  = rnd(-0.08, 1.08) * W;           // full width + a little beyond edges
    // y distribution: heavier at very bottom, tapering up
    const t  = Math.pow(Math.random(), 0.7);    // bias toward bottom
    const y  = H * (0.58 + t * 0.42);
    const hue = rnd(105, 132);
    const sat = rnd(52, 80);
    const lig = rnd(18, 42) + t * 22;           // brighter at bottom edge
    const h   = rnd(18, 65) * (0.3 + t * 0.8); // taller at front
    const w   = rnd(1.2, 3.2) * (0.4 + t * 0.7);
    grassBlades.push({
      x, y, h, w,
      lean: rnd(-0.5, 0.5),
      ss: rnd(0.3, 1.1), sa: rnd(0.06, 0.22), so: rnd(0, Math.PI * 2),
      top: `hsl(${hue + 10},${sat + 12}%,${lig + 16}%)`,
      bot: `hsl(${hue},${sat}%,${lig}%)`
    });
  }
  // Sort back to front by y
  grassBlades.sort((a, b) => a.y - b.y);
}
buildGrass();
window.addEventListener('resize', buildGrass);

function drawForegroundGrass(wind) {
  grassBlades.forEach(b => {
    const sw  = Math.sin(time * b.ss + b.so + wind) * b.sa;
    const lx  = b.lean + sw;
    const tx  = b.x + lx * b.h * 1.25,  ty = b.y - b.h;
    const mx  = b.x + lx * b.h * 0.52,  my = b.y - b.h * 0.56;
    const g   = ctx.createLinearGradient(b.x, b.y, tx, ty);
    g.addColorStop(0, b.bot);
    g.addColorStop(1, b.top);
    ctx.beginPath();
    ctx.moveTo(b.x - b.w * 0.45, b.y);
    ctx.quadraticCurveTo(mx, my, tx, ty);
    ctx.quadraticCurveTo(mx + b.w * 0.35, my, b.x + b.w * 0.45, b.y);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
  });
}

// ── BURST ──────────────────────────────────────────────────
function burst(x,y){for(let i=0;i<24;i++)petals.push(mkPetal(x,y,false));}
setInterval(()=>{petals.push(mkPetal(Math.random()*W,-10,true));},700);

// ── MAIN LOOP ──────────────────────────────────────────────
function loop(){
  time+=.016;windPhase+=.007;
  const wind=Math.sin(windPhase)*.55+Math.sin(windPhase*2.3)*.22;
  vpX+=(W*.5+(mxRaw-W*.5)*.06-vpX)*.035;

  drawWorld();

  // All items sorted by z — back to front
  const all=[
    ...clusters.map(c=>({z:c.z,t:'f',d:c}))
  ];
  all.sort((a,b)=>a.z-b.z);
  all.forEach(item=> drawCluster(item.d, wind));

  for(let i=sparkles.length-1;i>=0;i--){
    const s=sparkles[i];s.life++;
    if(s.life>s.max){sparkles.splice(i,1);sparkles.push(mkSparkle());}
    else drawSparkle(s);
  }

  for(let i=petals.length-1;i>=0;i--){
    const p=petals[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.rot+=p.rv;p.life-=p.dec;
    if(p.life<=0||p.y>H+60){petals.splice(i,1);continue;}
    drawPetal(p);
  }

  vignette();
  requestAnimationFrame(loop);
}
loop();

  gemCard.style.top=top+'px';
  gemCard.style.width=cw+'px';
  if(openGemIdx>=0&&openGemIdx!==idx){gemEls[openGemIdx].classList.remove('open');gemEls[openGemIdx].classList.add('revealed');}
  openGemIdx=idx;
  el.classList.remove('revealed');el.classList.add('open');
  gemCard.classList.remove('card-visible');
  void gemCard.offsetWidth;
  gemCard.classList.add('card-visible');
}

function closeGemCard(){
  if(openGemIdx>=0){gemEls[openGemIdx].classList.remove('open');gemEls[openGemIdx].classList.add('revealed');openGemIdx=-1;}
  gemCard.classList.remove('card-visible');
}

gemEls.forEach((el,idx)=>{
  el.addEventListener('click',e=>{e.stopPropagation();if(el.classList.contains('hidden'))return;openGemIdx===idx?closeGemCard():openGemCard(idx,el);});
  el.addEventListener('touchstart',e=>{e.stopPropagation();},{passive:true});
  el.addEventListener('touchend',e=>{e.stopPropagation();if(el.classList.contains('hidden'))return;openGemIdx===idx?closeGemCard():openGemCard(idx,el);},{passive:true});
});

document.getElementById('gem-card-close').addEventListener('click',e=>{e.stopPropagation();closeGemCard();});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeGemCard();}});
</script>
